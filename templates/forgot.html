{% extends "base.html" %}
{% block content %}
<section class="section-heading">
  <h1>Forgot password</h1>
  <p>Enter your email address and we will send a reset link with steps to create a new password.</p>
</section>

<section class="form-panel">
  <form id="forgot-form" class="panel-form">
    <label>Email<input name="email" type="email" required placeholder="you@example.com" /></label>
    <button class="button button-primary">Send reset email</button>
  </form>
  <div class="form-message" id="forgot-message"></div>
  <p class="form-footer">Remembered your password? <a href="/login">Log in</a></p>
</section>
{% endblock %}
