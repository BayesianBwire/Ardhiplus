{% extends "base.html" %}
{% block content %}
<section class="form-panel">
  <h1>Login to your account</h1>
  <p>Access your dashboard, manage listings, and review survey requests.</p>
  <form id="login-form" class="panel-form">
    <label>Email<input name="email" type="email" required placeholder="you@example.com" /></label>
    <label>Password
      <div class="password-field">
        <input name="password" type="password" required placeholder="••••••••" />
        <button type="button" class="password-toggle" aria-label="Toggle password visibility">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5c-7 0-11 7-11 7s4 7 11 7 11-7 11-7-4-7-11-7zm0 12a5 5 0 110-10 5 5 0 010 10z" fill="currentColor"/></svg>
        </button>
      </div>
    </label>
    <button class="button button-primary">Login</button>
  </form>
  <div class="form-links">
    <a href="/forgot-password">Forgot password?</a>
  </div>
  <div id="login-message" class="form-message"></div>
  <p class="form-footer">Don’t have an account? <a href="/register">Register now</a></p>
</section>
{% endblock %}
