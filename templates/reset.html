{% extends "base.html" %}
{% block content %}
<section class="section-heading">
  <h1>Reset password</h1>
  <p>Use the link from your email to set a new secure password.</p>
</section>

<section class="form-panel">
  <form id="reset-form" class="panel-form">
    <input type="hidden" name="token" value="{{ token }}" />
    <label>New password
      <div class="password-field">
        <input name="new_password" type="password" required placeholder="••••••••" />
        <button type="button" class="password-toggle">Show</button>
      </div>
    </label>
    <label>Confirm password
      <div class="password-field">
        <input name="confirm_password" type="password" required placeholder="••••••••" />
        <button type="button" class="password-toggle">Show</button>
      </div>
    </label>
    <p class="password-rules">Password must be at least 8 characters and include uppercase, lowercase, number, and special character. It cannot be numbers only.</p>
    <button class="button button-primary">Save new password</button>
  </form>
  <div id="reset-message" class="form-message"></div>
  <p class="form-footer">Back to <a href="/login">Login</a></p>
</section>
{% endblock %}
