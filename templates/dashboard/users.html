{% extends 'dashboard/base.html' %}
{% block content %}
<div class="card">
    <h2>Users Management</h2>
</div>
<div class="card">
    <table border="1" width="100%" cellpadding="10">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Registered At</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
            <td>{{ user.registered_at }}</td>
            <td>
                <a href="/dashboard/admin/users/edit/{{ user.id }}/">Edit</a>
                <form action="/dashboard/admin/users/delete/{{ user.id }}/" method="POST" style="display:inline;">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this user?');">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
